<svg width="400" height="480" viewBox="0 0 400 480" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="400" height="480" rx="18" fill="#1e3a8a"/>

  <!-- Top accent bar -->
  <rect x="0" y="0" width="400" height="5" rx="2" fill="#3b82f6"/>

  <!-- Large neural network icon -->
  <!-- Outer ring -->
  <circle cx="200" cy="185" r="90" fill="none" stroke="#3b82f6" stroke-width="2.5"/>
  <!-- Middle ring dashed -->
  <circle cx="200" cy="185" r="62" fill="none" stroke="#60a5fa" stroke-width="1.2" stroke-dasharray="5 4"/>
  <!-- Center glow rings -->
  <circle cx="200" cy="185" r="26" fill="#1d4ed8"/>
  <circle cx="200" cy="185" r="16" fill="#3b82f6"/>
  <circle cx="200" cy="185" r="7" fill="#93c5fd"/>

  <!-- Outer nodes (8 points) -->
  <circle cx="200" cy="95"  r="9" fill="#60a5fa"/>
  <circle cx="200" cy="275" r="9" fill="#60a5fa"/>
  <circle cx="110" cy="185" r="9" fill="#60a5fa"/>
  <circle cx="290" cy="185" r="9" fill="#60a5fa"/>
  <circle cx="136" cy="121" r="7" fill="#93c5fd"/>
  <circle cx="264" cy="121" r="7" fill="#93c5fd"/>
  <circle cx="136" cy="249" r="7" fill="#93c5fd"/>
  <circle cx="264" cy="249" r="7" fill="#93c5fd"/>

  <!-- Spokes center to nodes -->
  <line x1="200" y1="159" x2="200" y2="104" stroke="#60a5fa" stroke-width="1.5"/>
  <line x1="200" y1="211" x2="200" y2="266" stroke="#60a5fa" stroke-width="1.5"/>
  <line x1="174" y1="185" x2="119" y2="185" stroke="#60a5fa" stroke-width="1.5"/>
  <line x1="226" y1="185" x2="281" y2="185" stroke="#60a5fa" stroke-width="1.5"/>
  <line x1="185" y1="170" x2="143" y2="128" stroke="#93c5fd" stroke-width="1.2"/>
  <line x1="215" y1="170" x2="257" y2="128" stroke="#93c5fd" stroke-width="1.2"/>
  <line x1="185" y1="200" x2="143" y2="242" stroke="#93c5fd" stroke-width="1.2"/>
  <line x1="215" y1="200" x2="257" y2="242" stroke="#93c5fd" stroke-width="1.2"/>

  <!-- Outer ring connector lines -->
  <line x1="119" y1="185" x2="143" y2="128" stroke="#bfdbfe" stroke-width="0.8" stroke-dasharray="3 3"/>
  <line x1="143" y1="128" x2="200" y2="95"  stroke="#bfdbfe" stroke-width="0.8" stroke-dasharray="3 3"/>
  <line x1="200" y1="95"  x2="257" y2="128" stroke="#bfdbfe" stroke-width="0.8" stroke-dasharray="3 3"/>
  <line x1="257" y1="128" x2="281" y2="185" stroke="#bfdbfe" stroke-width="0.8" stroke-dasharray="3 3"/>
  <line x1="281" y1="185" x2="257" y2="242" stroke="#bfdbfe" stroke-width="0.8" stroke-dasharray="3 3"/>
  <line x1="257" y1="242" x2="200" y2="275" stroke="#bfdbfe" stroke-width="0.8" stroke-dasharray="3 3"/>
  <line x1="200" y1="275" x2="143" y2="242" stroke="#bfdbfe" stroke-width="0.8" stroke-dasharray="3 3"/>
  <line x1="143" y1="242" x2="119" y2="185" stroke="#bfdbfe" stroke-width="0.8" stroke-dasharray="3 3"/>

  <!-- AI pill badge -->
  <rect x="151" y="298" width="98" height="30" rx="15" fill="#3b82f6"/>
  <text x="200" y="318" text-anchor="middle" font-family="Georgia, serif" font-size="14" font-weight="700" fill="#ffffff" letter-spacing="4">A I</text>

  <!-- Main title -->
  <text x="200" y="362" text-anchor="middle" font-family="Georgia, serif" font-size="26" font-weight="700" fill="#ffffff" letter-spacing="2">RESUME</text>
  <text x="200" y="394" text-anchor="middle" font-family="Georgia, serif" font-size="20" font-weight="700" fill="#ffffff" letter-spacing="1">SHORTLISTING</text>
  <text x="200" y="424" text-anchor="middle" font-family="Georgia, serif" font-size="20" font-weight="700" fill="#60a5fa" letter-spacing="1">SYSTEM</text>

  <!-- Divider -->
  <line x1="60" y1="438" x2="340" y2="438" stroke="#3b82f6" stroke-width="0.8" stroke-opacity="0.7"/>

  <!-- Subtitle -->
  <text x="200" y="456" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#93c5fd" letter-spacing="3">PDF GENERATOR</text>

  <!-- Bottom accent bar -->
  <rect x="0" y="475" width="400" height="5" rx="2" fill="#3b82f6"/>
</svg>
