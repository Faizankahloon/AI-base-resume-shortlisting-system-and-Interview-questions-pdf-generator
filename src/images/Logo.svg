<svg width="240" height="64" viewBox="0 0 240 64" fill="none" xmlns="http://www.w3.org/2000/svg">

  <!-- transparent background — no rect fill -->

  <!-- Icon mark container -->
  <rect x="0" y="8" width="40" height="40" rx="11" fill="#1a1a2e"/>

  <!-- Document body -->
  <rect x="8" y="14" width="18" height="22" rx="3.5" fill="#818cf8"/>

  <!-- Document fold -->
  <polygon points="21,14 26,14 26,19 21,19" fill="#312e81"/>
  <polygon points="21,14 26,19 21,19" fill="#4338ca"/>

  <!-- Doc lines -->
  <rect x="10.5" y="20" width="7" height="2" rx="1" fill="#1e1b4b"/>
  <rect x="10.5" y="24" width="11" height="1.5" rx="0.75" fill="#312e81" opacity="0.7"/>
  <rect x="10.5" y="27.5" width="9" height="1.5" rx="0.75" fill="#312e81" opacity="0.7"/>

  <!-- Green check circle -->
  <circle cx="30" cy="37" r="7" fill="#0d2018"/>
  <circle cx="30" cy="37" r="5.5" fill="#10b981"/>
  <polyline points="27,37 29.2,39.5 33.5,34" fill="none" stroke="#ffffff" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Wordmark -->
  <text x="52" y="33" font-family="'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="-0.5" fill="#f0f0ff">Recruit</text>
  <text x="126" y="33" font-family="'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="-0.5" fill="#818cf8">AI</text>

  <!-- Subtitle -->
  <text x="53" y="46" font-family="'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="8" font-weight="600" letter-spacing="3" fill="#E6EFFF">SHORTLISTING</text>

</svg>
